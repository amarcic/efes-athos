<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>

    <!-- Foundation 4.3.1 — required for XSLT-generated tabs -->
    <link rel="stylesheet" href="/assets/vendor/foundation/normalize-4.3.1.min.css">
    <link rel="stylesheet" href="/assets/vendor/foundation/foundation-4.3.1.min.css">

    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/epidoc.css">
    <link rel="stylesheet" href="/assets/css/project.css">
</head>
<body>
<header>
    <div class="header-inner">
        <div class="header-content">
            <h1 id="site-title">
                <a href="/en/" class="site-title-link">
                    <!-- Website Title -->
                    <span class="site-title-full">Monumental Donor Epigraphy on Mt Athos (10th-17th centuries)</span>
                </a>
            </h1>

            <!-- Navigation Menu -->
            <nav class="site-nav">
                <a href="/en/inscriptions/" class="nav-link">Inscriptions</a>
                <a href="/en/search/" class="nav-link">Search</a>
                <!-- Indices dropdown menu -->
                <div class="nav-dropdown">
                    <a href="/en/indices/" class="nav-link nav-dropdown-toggle">Indices</a>
                    <ul class="nav-dropdown-menu">
                        <!-- This will generate one menu entry for each index found in
                             _data/indices/_summary.json generated by stylesheets/lib/aggregate-indices.xsl -->
                        
                            
                            
                            <li><a href="/en/indices/persons/">Persons</a></li>
                            
                            
                            
                            <li><a href="/en/indices/professions/">Professions</a></li>
                            
                            
                        
                    </ul>
                </div>
                <a href="/en/bibliography/" class="nav-link">Bibliography</a>
            </nav>

            <!-- Uncomment for multi-language support (requires _data/languages.json):
            <nav class="language-switcher">
                
                    
                        <span class="lang-current">EN</span>
                    
                
            </nav>
            -->
        </div>
    </div>
</header>


<div class="layout-grid">
    
    <h1>Search</h1>
    

    <main>
        
<link rel="stylesheet" href="/assets/efes-search/efes-search.css">
<script type="module" src="/assets/efes-search/efes-search.js"></script>


<efes-search data-url="/search-data/documents_en.json" text-fields="fullText,title" match-mode="prefix">
    <aside class="efes-facet-sidebar">
        <h2>Filter Results</h2>
        <efes-search-input placeholder="Search..."></efes-search-input>

        <!-- FACET FILTERS -->
        <!-- Add/uncomment efes-facet elements to add filter facets (field must exist in extract-search) -->

        <efes-facet field="material" label="Material" expanded></efes-facet>
        <efes-facet field="execution" label="Execution" expanded></efes-facet>

        <div class="efes-filter-actions">
            <button data-action="clear-all">Clear All Filters</button>
        </div>
    </aside>

    <div class="efes-search-main">
        <efes-active-filters></efes-active-filters>

        <div class="efes-results-bar">
            <span class="efes-results-status">
                <efes-result-count template="Found {total} documents." filtered-template="Found {count} of {total} documents."></efes-result-count>
            </span>
            <span class="efes-sort-label">Sort by</span>
            <efes-sort>
                <field key="sortKey">ID</field>
                <field key="title">Title</field>
            </efes-sort>
        </div>

        <!-- The template below is displayed for each search result -->
        
        <efes-results result-url="/en/inscriptions/{documentId}/">
            <template>
                <a>
                    <div class="efes-result-title">
                        <span class="doc-id" data-field="documentId"></span>
                        <span data-field="title"></span>
                    </div>
                    <!-- Uncomment to show additional fields below each result
                         (fields must be enabled in extract-search): -->
                    <div class="efes-result-details">
                        <span data-field="origDate"></span>
                        <span data-field="material"></span>
                    </div>
                </a>
            </template>
        </efes-results>
    </div>
</efes-search>

    </main>
</div>

<footer>
    <div class="footer-inner">
        <p><a href="https://www.history.ox.ac.uk/patronage-and-power-in-the-pre-modern-mediterranean#tab-5723936" target="_blank" rel="noopener">Patronage and Power in the Pre-Modern Mediterranean</a></p>
        <p>Powered by <a href="https://github.com/CCeH" target="_blank" rel="noopener">EFES-NG</a></p>
    </div>
</footer>


<script src="/assets/vendor/foundation/jquery-1.10.2.min.js"></script>
<script src="/assets/vendor/foundation/foundation-4.3.1.min.js"></script>
<script>
    $(document).foundation();
</script>
</body>
</html>
